version: 2.1

executors:
  ruby-executor:
    docker:
      - image: ruby:3.3.0
    working_directory: ~/app

parameters:
  ip_ranges:
    type: boolean
    default: true

commands:
  generate-dotenv:
    steps:
      - run:
          name: Install yq
          command: |
            wget -q https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -O /usr/local/bin/yq
            chmod +x /usr/local/bin/yq

      - run:
          name: Generate .env from env_keys.yml
          command: |
            echo "Generating .env file from .circleci/env_keys.yml..."
            touch .env
            for key in $(yq e '.env_keys[]' .circleci/env_keys.yml); do
              echo "Processing: $key"
              value=$(printenv "$key")
              if [ -z "$value" ]; then
                echo "⚠️  Warning: $key is not set in environment. Using empty string."
              fi
              echo "$key=${value:-}" >> .env
            done
            echo "✅ .env file generated"
            cat .env

jobs:
  install_dependencies:
    executor: ruby-executor
    steps:
      - checkout
      - run:
          name: Install System Dependencies
          command: |
            apt-get update && apt-get install -y build-essential libpq-dev mariadb-client libmariadb-dev libmariadb-dev-compat
      - run:
          name: Install Bundler
          command: gem install bundler
      - run:
          name: Install Gems
          command: bundle install --jobs 4 --retry 3

  deploy_to_develop:
    executor: ruby-executor
    circleci_ip_ranges: << pipeline.parameters.ip_ranges >>
    steps:
      - checkout
      - run: gem install bundler
      - run: bundle install --jobs 4 --retry 3
      - generate-dotenv
      - run:
          name: Check Runner's IP Address
          command: curl -s ipinfo.io/ip
      - run:
          name: Deploy to Develop
          command: bundle exec cap staging deploy --trace

workflows:
  version: 2
  deploy_workflow:
    jobs:
      - install_dependencies
